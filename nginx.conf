# Optional: nginx in front of the built PWA and the API.
#
# Not required to run the project. It is here for a production deployment where
# you want a single origin: that keeps the httpOnly refresh cookie same-site and
# avoids CORS entirely.
#
# Assumes the API is running on this host at 127.0.0.1:4000, and that the built
# frontend (npm run build -> dist/) has been copied to the root below.
#
# Terminate TLS in front of this, or add a listen 443 block with your
# certificates, before exposing it publicly - the application assumes HTTPS in
# production (plan section 53).
server {
    listen 80;
    server_name _;

    # Point this at the built frontend, for example C:/apps/skt/dist.
    root /var/www/skt;
    index index.html;

    # Payroll and employee data must not be cached by intermediaries.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # API traffic goes straight to the Node service, never cached.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        add_header Cache-Control "no-store" always;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }

    # Build output is content-hashed, so it can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be served stale, or clients get stuck on an
    # old shell.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # Single-page app: every unmatched path renders the shell and lets the
    # client router take over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
